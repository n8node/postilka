services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/conf.d/default-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    environment:
      ENVIRONMENT: production
      PUBLIC_APP_URL: https://postilka.ru/app
      DOMAIN: postilka.ru
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    environment:
      ENVIRONMENT: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: /app/api/v1
        NEXT_PUBLIC_APP_NAME: Postilka
    environment:
      NEXT_PUBLIC_API_URL: /app/api/v1
      NEXT_PUBLIC_APP_NAME: Postilka
      INTERNAL_API_URL: http://backend:8080
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wordpress:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

