services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/conf.d/default-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
      - ./nginx/snippets/postilka-locations.conf:/etc/nginx/snippets/postilka-locations.conf:ro
      - ./marketing/voxel-scene/dist:/usr/share/nginx/experience:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  outbound-proxy:
    # Host network: TCP to id.vk.ru uses the host stack (works when Docker bridge→VK TLS hangs).
    image: vimagick/tinyproxy:latest
    network_mode: host
    volumes:
      - ./config/tinyproxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Telegram Bot API: bridge cannot reach external HTTP proxy reliably — gost on host forwards to upstream.
  # Requires TELEGRAM_UPSTREAM_PROXY in .env (loaded via env_file, not compose ${} substitution).
  telegram-proxy:
    image: ginuerzh/gost:latest
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./scripts/telegram-proxy-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  youtube-proxy:
    image: ginuerzh/gost:latest
    network_mode: host
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./scripts/youtube-proxy-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  backend:
    depends_on:
      - outbound-proxy
      - telegram-proxy
      - youtube-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENVIRONMENT: production
      PUBLIC_APP_URL: https://postilka.ru/app
      DOMAIN: postilka.ru
      HTTPS_PROXY: http://host.docker.internal:8888
      HTTP_PROXY: http://host.docker.internal:8888
      https_proxy: http://host.docker.internal:8888
      http_proxy: http://host.docker.internal:8888
      NO_PROXY: postgres,mysql,backend,frontend,nginx,wordpress,localhost,127.0.0.1
      no_proxy: postgres,mysql,backend,frontend,nginx,wordpress,localhost,127.0.0.1
      TELEGRAM_LOCAL_PROXY: http://host.docker.internal:8889
      YOUTUBE_LOCAL_PROXY: http://host.docker.internal:8890
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    depends_on:
      - outbound-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENVIRONMENT: production
      HTTPS_PROXY: http://host.docker.internal:8888
      HTTP_PROXY: http://host.docker.internal:8888
      https_proxy: http://host.docker.internal:8888
      http_proxy: http://host.docker.internal:8888
      NO_PROXY: postgres,mysql,backend,frontend,nginx,wordpress,localhost,127.0.0.1
      no_proxy: postgres,mysql,backend,frontend,nginx,wordpress,localhost,127.0.0.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: /app/api/v1
        NEXT_PUBLIC_APP_NAME: Postilka
        NEXT_PUBLIC_SITE_URL: https://postilka.ru
    environment:
      NEXT_PUBLIC_API_URL: /app/api/v1
      NEXT_PUBLIC_APP_NAME: Postilka
      NEXT_PUBLIC_SITE_URL: https://postilka.ru
      INTERNAL_API_URL: http://backend:8080
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wordpress:
    volumes:
      - ./wordpress/plugins/postilka-voxel:/var/www/html/wp-content/plugins/postilka-voxel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

