# HTTPS — подключается только в prod (docker-compose.prod.yml)
# HTTP/2 off: Windows browsers (Chrome/YaBrowser) hit ERR_CONNECTION_RESET while
# curl --http1.1 to the same host works. Re-enable http2 after client path is stable.
server {
    listen 443 ssl;
    server_name postilka.ru www.postilka.ru;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache off;
    ssl_session_tickets off;
    lingering_close on;

    include /etc/nginx/snippets/postilka-locations.conf;
}
