# Outbound HTTP CONNECT proxy on the Docker host (network_mode: host).
# Backend/worker reach id.vk.ru via host.docker.internal when bridge→VK TLS fails.

User nobody
Group nobody
Port 8888
Listen 0.0.0.0
Timeout 600

Allow 127.0.0.1
Allow 172.16.0.0/12
Allow 10.0.0.0/8

ConnectPort 443
ConnectPort 563

MaxClients 64
MinSpareServers 1
MaxSpareServers 4
StartServers 2
